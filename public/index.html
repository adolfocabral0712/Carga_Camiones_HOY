<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123c2b">
  <title>Hoy - Carga de Camiones</title>

  <style>
    :root{
      --verde:#123c2b;
      --verde2:#1d6042;
      --fondo:#f2f5f3;
      --borde:#d8e1dc;
      --texto:#17221c;
      --muted:#68756e
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--fondo);
      color:var(--texto);
      font-family:Arial,Helvetica,sans-serif
    }

    header{
      background:var(--verde);
      color:#fff;
      border-bottom:5px solid #56a56f;
      padding:20px 24px
    }

    .header-inner{
      max-width:1800px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px
    }

    .eyebrow{
      margin:0 0 5px;
      color:#9ed1ae;
      font-size:10px;
      font-weight:800;
      letter-spacing:.17em
    }

    h1{
      margin:0;
      font-size:26px;
      letter-spacing:-.02em
    }

    .actualizado{
      margin:6px 0 0;
      color:#c9ddd1;
      font-size:11px
    }

    .refresh{
      border:1px solid #5f9278;
      border-radius:8px;
      background:#1d503a;
      color:#fff;
      padding:9px 13px;
      cursor:pointer
    }

    main{
      max-width:1800px;
      margin:auto;
      padding:16px
    }

    .resumen{
      display:grid;
      grid-template-columns:repeat(4,minmax(170px,1fr));
      gap:10px;
      margin-bottom:12px
    }

    .resumen-destinos{
      margin-bottom:12px;
      background:#fff;
      border:1px solid var(--borde);
      border-radius:10px;
      overflow:hidden
    }

    .resumen-destinos-titulo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:9px 14px;
      background:#e7eee9;
      border-bottom:1px solid #c6d2cb
    }

    .resumen-destinos-titulo h2{
      margin:0;
      font-size:13px
    }

    .resumen-destinos-controles{
      display:flex;
      align-items:center;
      gap:9px
    }

    .resumen-destinos-controles span{
      color:var(--muted);
      font-size:9px;
      font-weight:700;
      white-space:nowrap
    }

    #selectorTipoDestino{
      min-width:170px;
      padding:7px 9px;
      font-size:10px;
      font-weight:800
    }

    .quitar-filtro-destino{
      border:1px solid #b6c5bc;
      border-radius:6px;
      background:#fff;
      color:#42534a;
      padding:7px 9px;
      font-size:9px;
      font-weight:800;
      cursor:pointer;
      white-space:nowrap
    }

    .quitar-filtro-destino:hover{
      border-color:#17623d;
      color:#17623d
    }

    .resumen-destinos-wrap{
      overflow-x:auto
    }

    .tabla-destinos{
      width:100%;
      min-width:900px;
      table-layout:fixed;
      border-collapse:collapse;
      font-size:10px
    }

    .tabla-destinos th,
    .tabla-destinos td{
      width:10%;
      padding:8px 11px;
      border-bottom:1px solid #edf1ef;
      text-align:center
    }

    .tabla-destinos th:first-child,
    .tabla-destinos td:first-child{
      width:30%;
      text-align:left
    }

    .tabla-destinos tbody tr:last-child td{
      border-bottom:0
    }

    .destino-nombre{
      font-weight:800;
      color:#24352c
    }

    .destino-filtro{
      border:0;
      background:transparent;
      color:#174b91;
      font:inherit;
      font-weight:800;
      padding:0;
      text-align:left;
      cursor:pointer;
      text-decoration:underline;
      text-decoration-style:dotted;
      text-underline-offset:3px
    }

    .destino-filtro:hover{
      color:#0d693a
    }

    .contador-estado{
      display:inline-block;
      min-width:30px;
      border-radius:16px;
      padding:4px 8px;
      font-weight:900
    }

    .contador-vacio{
      background:#f8cbae;
      color:#522510
    }

    .contador-viaje{
      background:#ffe36e;
      color:#111
    }

    .contador-monte{
      background:#75db7a;
      color:#123c2b
    }

    .contador-salido{
      background:#64ffff;
      color:#153f43
    }

    .contador-descargando{
      background:#ff96ff;
      color:#542254
    }

    .contador-planta{
      background:#dce9ff;
      color:#174b91
    }

    .contador-total{
      background:#e2e8e4;
      color:#26372e
    }

      background:#fff
